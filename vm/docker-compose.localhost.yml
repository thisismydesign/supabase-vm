# Published ports bind to localhost only. The proxy inside the VM, Tailscale or cloudflared, forwards to them.
networks:
  default:
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

# Functions get Auth's site URL; the bundle only passes the API's public URL.
services:
  functions:
    environment:
      SITE_URL: ${SITE_URL}
